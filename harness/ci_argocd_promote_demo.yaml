pipeline:
  name: CI ArgoCD Promote Demo
  identifier: ci_argocd_promote_demo
  projectIdentifier: soto_sandbox
  orgIdentifier: sandbox
  tags:
    demo: argocd-promote
    prospect: squarespace
  description: >
    Build once, promote the same image tag Dev → Staging → Prod by updating
    Git desired state. Plain ArgoCD auto-syncs each environment. Selective
    stage re-run ≈ Drone build promote. Build stage also demos Test Intelligence,
    test splitting, coverage, and flaky detection.
  allowStageExecutions: true
  properties:
    ci:
      codebase:
        connectorRef: ghalexsotoharnessfinegrained
        repoName: harness-ci-argocd-promote-demo
        build:
          type: branch
          spec:
            branch: <+input>.default(main)
  variables:
    - name: imageTag
      type: String
      description: >
        Image tag to build and/or promote. Full runs default to sequenceId.
        For Drone-like promote re-runs of Staging/Prod only, pass the prior tag.
      value: <+input>.default(<+pipeline.sequenceId>)
    - name: flakyTests
      type: String
      description: >
        Flaky demo mode for Jest: off | force_fail | force_pass | random.
        Re-run Build twice on the same commit (force_fail then force_pass) to
        surface FLAKY badges in Test Management.
      value: <+input>.default(off).allowedValues(off,force_fail,force_pass,random)
    - name: demoSlowMs
      type: String
      description: >
        Per-unit delay base (ms) for slow suites. Default 250 (~5 min serial).
        Set 0 for a fast run. Coverage step always forces 0.
      value: <+input>.default(250)
  stages:
    - stage:
        name: Build
        identifier: build
        type: CI
        variables:
          - name: CI_ENABLE_RUNTESTV2_JS
            type: String
            description: Enable Jest / JS Test Intelligence (beta). Prefer stage-scoped.
            value: "true"
          - name: CI_ENABLE_HCLI_FOR_TESTS
            type: String
            description: Enable hcli-backed test management / coverage uploads.
            value: "true"
        spec:
          cloneCodebase: true
          caching:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install deps
                  identifier: install_deps
                  spec:
                    shell: Sh
                    command: |
                      cd app
                      npm install
              - step:
                  type: Test
                  name: Intelligent Tests
                  identifier: intelligent_tests
                  spec:
                    shell: Sh
                    # Docs still show intelligenceMode; Jest beta also expects intelligence.disabled=false
                    intelligenceMode: true
                    intelligence:
                      disabled: false
                    parallelism: 4
                    globs:
                      - "app/**/__tests__/**/*.test.js"
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "app/junit-*.xml"
                    envVariables:
                      CI_ENABLE_RUNTESTV2_JS: "true"
                      CI_ENABLE_HCLI_FOR_TESTS: "true"
                      FLAKY_TESTS: <+pipeline.variables.flakyTests>
                      DEMO_SLOW_MS: <+pipeline.variables.demoSlowMs>
                      JEST_JUNIT_OUTPUT_DIR: /harness/app
                    command: |-
                      cd app
                      # TI agent wraps this command, selects tests, and assigns each shard
                      # a subset. parallelism: 4 (YAML field above) creates the shards —
                      # it is NOT passed to Jest. Each shard must write a unique JUnit file.
                      export JEST_JUNIT_OUTPUT_NAME="junit-${HARNESS_NODE_INDEX:-0}.xml"
                      echo "shard HARNESS_NODE_INDEX=${HARNESS_NODE_INDEX:-unset} HARNESS_NODE_TOTAL=${HARNESS_NODE_TOTAL:-unset}"
                      npx jest \
                        --coverage=false \
                        --reporters=default \
                        --reporters=jest-junit \
                        --passWithNoTests
              - step:
                  type: Run
                  name: Coverage upload
                  identifier: coverage_upload
                  spec:
                    shell: Sh
                    envVariables:
                      CI_ENABLE_HCLI_FOR_TESTS: "true"
                      FLAKY_TESTS: "off"
                      DEMO_SLOW_MS: "0"
                    command: |-
                      cd app
                      # Coverage only — do not re-upload JUnit (avoids duplicate Tests-tab view).
                      DEMO_SLOW_MS=0 FLAKY_TESTS=off npx jest \
                        --runInBand \
                        --coverage \
                        --coverageReporters=text \
                        --coverageReporters=lcov \
                        --reporters=default
                      hcli cov upload --file=coverage/lcov.info
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push
                  identifier: build_and_push
                  spec:
                    connectorRef: dockerhubalexsotoharness
                    repo: alexsotoharness/harness-ci-argocd-promote-demo
                    tags:
                      - <+pipeline.variables.imageTag>
                    dockerfile: Dockerfile
                    optimize: true
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - stage:
        name: Promote Dev
        identifier: promote_dev
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Promote Dev
                  identifier: promote_dev
                  spec:
                    shell: Bash
                    command: |
                      chmod +x scripts/promote.sh
                      export GITHUB_TOKEN="<+secrets.getValue("gh-alexsoto-harness-fine-grained-token")>"
                      ./scripts/promote.sh dev "<+pipeline.variables.imageTag>"
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        when:
          pipelineStatus: Success
    - stage:
        name: Approve Staging
        identifier: approve_staging
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Staging Promote
                  identifier: approve_staging
                  timeout: 1d
                  spec:
                    approvalMessage: >
                      Promote image tag <+pipeline.variables.imageTag> to Staging?
                      (Creates/merges a Git PR updating envs/staging — ArgoCD syncs after merge.)
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account._account_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
        when:
          pipelineStatus: Success
    - stage:
        name: Promote Staging
        identifier: promote_staging
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Promote Staging
                  identifier: promote_staging
                  spec:
                    shell: Bash
                    command: |
                      chmod +x scripts/promote.sh
                      export GITHUB_TOKEN="<+secrets.getValue("gh-alexsoto-harness-fine-grained-token")>"
                      ./scripts/promote.sh staging "<+pipeline.variables.imageTag>"
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        when:
          pipelineStatus: Success
    - stage:
        name: Approve Prod
        identifier: approve_prod
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Prod Promote
                  identifier: approve_prod
                  timeout: 1d
                  spec:
                    approvalMessage: >
                      Promote image tag <+pipeline.variables.imageTag> to Prod?
                      (Creates/merges a Git PR updating envs/prod — ArgoCD syncs after merge.)
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account._account_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
        when:
          pipelineStatus: Success
    - stage:
        name: Promote Prod
        identifier: promote_prod
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Promote Prod
                  identifier: promote_prod
                  spec:
                    shell: Bash
                    command: |
                      chmod +x scripts/promote.sh
                      export GITHUB_TOKEN="<+secrets.getValue("gh-alexsoto-harness-fine-grained-token")>"
                      ./scripts/promote.sh prod "<+pipeline.variables.imageTag>"
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        when:
          pipelineStatus: Success
