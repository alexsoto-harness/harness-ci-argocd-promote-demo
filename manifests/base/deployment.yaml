apiVersion: apps/v1
kind: Deployment
metadata:
  name: promote-demo
  labels:
    app.kubernetes.io/name: promote-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: promote-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promote-demo
    spec:
      containers:
        - name: promote-demo
          image: alexsotoharness/harness-ci-argocd-promote-demo:placeholder
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: base
            - name: IMAGE_TAG
              value: placeholder
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: promote-demo
  labels:
    app.kubernetes.io/name: promote-demo
spec:
  selector:
    app.kubernetes.io/name: promote-demo
  ports:
    - name: http
      port: 80
      targetPort: http
